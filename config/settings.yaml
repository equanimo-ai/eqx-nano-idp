server:
  host: 0.0.0.0
  port: ${PORT:8000}
  debug: false
oauth:
  issuer: ${OAUTH_ISSUER:http://localhost:8000}
  audience: my-app
  token_expiry_minutes: 60
  clients:
  - client_id: demo-client
    client_secret: demo-secret
    description: Default demo client for development
  - client_id: test-client
    client_secret: test-secret
    description: Test client for integration tests
  - client_id: multi-aud-client
    client_secret: multi-aud-secret
    description: no auds
  - client_id: registered-client
    client_secret: registered-secret
    description: Client with registered redirect URIs (exact matching, issue
    redirect_uris:
    - http://localhost:3000/callback
  issuer_from_request: false
  issuer_from_proxy_headers: false
saml:
  entity_id: ${SAML_ENTITY_ID:http://localhost:8000/saml}
  sso_url: ${SAML_SSO_URL:http://localhost:8000/saml/sso}
  default_acs_url: http://localhost:8080/login/saml2/sso/nanoidp
  sign_responses: true
  c14n_algorithm: exc_c14n
  strict_binding: false
  export_roles: false
  export_groups: false
  roles_attr_name: roles
  groups_attr_name: groups
jwt:
  algorithm: RS256
  keys_dir: ./keys
authority_prefixes:
  roles: ROLE_
  groups: GROUP_
  identity_class: IDENTITY_
  entitlements: ENT_
allowed_identity_classes:
- INTERNAL
- EXTERNAL
session:
  secret_key: dev-secret-key-change-in-production
  permanent: true
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  log_token_requests: true
  log_saml_requests: true
clerk:
  enabled: ${CLERK_ENABLED:true}
  publishable_key: ${CLERK_PUBLISHABLE_KEY:pk_test_aW4taGFnZmlzaC00NC5jbGVyay5hY2NvdW50cy5kZXYk}
  secret_key: ${CLERK_SECRET_KEY:sk_test_TpttyaVzUzReFTzVB9u1WyuaWtD4Yg8ZpXZ7I3bjDP}
  frontend_api: ${CLERK_FRONTEND_API:in-hagfish-44.clerk.accounts.dev}
  sign_in_url: ${CLERK_SIGN_IN_URL:}
  jwks_url: ${CLERK_JWKS_URL:https://in-hagfish-44.clerk.accounts.dev/.well-known/jwks.json}
  allowed_domains:
  - equanimo.ai
  allowed_emails: []
  allowed_orgs:
  - org_3IAADDh9tenYWKUofjRdltKWc60

