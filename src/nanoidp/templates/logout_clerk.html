<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing out - NanoIDP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logout-card {
            width: 100%;
            max-width: 460px;
            background: #fff;
            border-radius: 1rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .logout-header {
            background: linear-gradient(135deg, #198754 0%, #0d6efd 100%);
            color: #fff;
            padding: 2rem;
            border-radius: 1rem 1rem 0 0;
            text-align: center;
        }
        .logout-header i {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        .logout-body {
            padding: 2rem;
            text-align: center;
        }
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
    </style>
</head>
<body>
    <div class="logout-card">
        <div class="logout-header">
            <i class="bi bi-box-arrow-right"></i>
            <h3 class="mb-0">NanoIDP</h3>
            <small class="opacity-75">Signing Out</small>
        </div>
        <div class="logout-body">
            <div class="mb-4">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Signing out...</span>
                </div>
            </div>
            <h5 class="mb-3">Signing out of Clerk...</h5>
            <p class="text-muted mb-0">
                Your NanoIDP session has been terminated. One moment while your Clerk session is cleared too.
            </p>
        </div>
    </div>

    <script defer crossorigin="anonymous"
        data-clerk-publishable-key="{{ clerk_publishable_key }}"
        src="https://{{ clerk_frontend_api }}/npm/@clerk/clerk-js@6/dist/clerk.browser.js"></script>
    <script>
        function goToLogin() {
            window.location.href = {{ url_for('ui.login')|tojson }};
        }

        window.addEventListener('load', function () {
            var timeout = new Promise(function (resolve) { setTimeout(resolve, 4000); });
            var signOut = Clerk.load({})
                .then(function () { return Clerk.signOut(); })
                .catch(function () {
                    // Clerk unreachable - the local session is already cleared,
                    // don't strand the user on this page.
                });
            Promise.race([signOut, timeout]).then(goToLogin);
        });
    </script>
</body>
</html>
