name: Terraform (Dev)

on:
  # Infra changes must reach AWS on merge. Without this the workflow was
  # dispatch-only, so merged Terraform sat unapplied and the repo drifted from
  # the account -- a green "CI/CD & Deploy (Dev)" run only means the image was
  # pushed, it never planned or applied.
  push:
    branches: [internal-main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev

jobs:
  dev:
    name: Apply Infrastructure — dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # AWS_SERVICE_DEPLOY_ROLE_PREFIX names a per-repo role that does not
          # exist in the dev account; only the two shared roles do. This job
          # runs terraform, so it takes the infra role.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/${{ vars.AWS_INFRA_ROLE_NAME_DEV }}
          aws-region: ${{ env.AWS_REGION }}


      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform Init
        run: terraform init -backend-config="backend-configs/dev.hcl"

      - name: Terraform Apply
        run: terraform apply -var-file="envs/dev/dev.tfvars" -auto-approve
