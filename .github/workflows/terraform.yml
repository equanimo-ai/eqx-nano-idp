name: Terraform (Dev)

on:
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev

jobs:
  dev:
    name: Apply Infrastructure — dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_SERVICE_DEPLOY_ROLE_PREFIX }}-${{ env.ENVIRONMENT }}
          aws-region: ${{ env.AWS_REGION }}


      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Init
        run: terraform init -backend-config="backend-configs/dev.hcl"

      - name: Terraform Apply
        run: terraform apply -var-file="envs/dev/dev.tfvars" -auto-approve
