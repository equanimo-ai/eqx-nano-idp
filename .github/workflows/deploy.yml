name: CI (Dev)

on:
  push:
    branches: [internal-main]
  pull_request:
    branches: [internal-main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .[dev]
      - name: Run pytest
        run: pytest
